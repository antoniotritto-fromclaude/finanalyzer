[theme]
primaryColor = "#D4AF37"
backgroundColor = "#0A1628"
secondaryBackgroundColor = "#1E293B"
textColor = "#FFFFFF"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
